<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>平安包打地鼠</title><link rel="stylesheet" href="style.css?v=3"><link rel="stylesheet" href="objects-v2.css"><link rel="stylesheet" href="levels-v3.css"></head><body>
<main id="game" class="game"><img class="backdrop" src="assets/festival-board.png" alt="長洲太平清醮遊戲攤位"><header class="hud"><div class="brand"><small id="brandLine"></small><h1><i id="brandMain"></i><br><span id="brandSub"></span></h1></div><div class="stats"><div><small id="levelLabel"></small><b id="level">1 / 3</b></div><div><small id="timeLabel"></small><b id="time">120</b></div><div><small id="scoreLabel"></small><b id="score">0</b></div><div class="accuracy-stat"><small id="accuracyLabel"></small><b id="accuracy">0%</b><i><span id="accuracyFill"></span></i></div></div><button id="pause" class="pause" type="button" aria-label="暫停">Ⅱ</button></header>
<aside class="help"><b id="helpTitle"></b><p id="helpText"></p><span><i id="bunLegend"></i> <strong id="bunCounter">0 / 0</strong><br><i id="tartLegend"></i> <em id="tartPenalty"></em></span></aside><section id="holes" class="holes" aria-label="平安包遊戲板"></section><div id="mallet" class="mallet" aria-hidden="true"><i>平安</i></div></main>
<div id="preloadModal" class="modal preload-modal"><div><small>CHEUNG CHAU FESTIVAL</small><h2 id="loadingTitle">正在準備平安包…</h2><div class="load-track"><span id="loadFill"></span></div><strong id="loadPercent">0%</strong></div></div>
<div id="startModal" class="modal hidden"><div><small id="startEyebrow"></small><h2 id="startTitle"></h2><p id="startText"></p><div class="level-preview" id="levelPreview"></div><button id="start" type="button"></button><button id="openCertificate" class="secondary hidden" type="button">查看平安包達人證書</button></div></div>
<div id="pauseModal" class="modal hidden"><div><small id="pauseEyebrow"></small><h2 id="pauseTitle"></h2><button id="resume" type="button"></button></div></div>
<div id="levelModal" class="modal hidden"><div><small id="levelEyebrow"></small><h2 id="levelTitle"></h2><strong id="levelResult"></strong><p id="levelText"></p><div class="modal-actions"><button id="retryLevel" class="secondary" type="button"></button><button id="nextLevel" type="button"></button></div></div></div>
<div id="finishModal" class="modal hidden"><div><small id="finishEyebrow"></small><h2 id="finishTitle"></h2><strong id="finalScore"></strong><p id="finishText"></p><button id="viewCertificate" type="button">查看平安包達人證書</button><div class="modal-actions"><button id="retry" class="secondary" type="button"></button><button id="returnStory" type="button"></button></div></div></div>
<div id="certificateModal" class="modal hidden"><div class="certificate-card"><small>BUN FESTIVAL MASTER AWARD</small><h2>已獲得平安包達人證書！</h2><img src="assets/peace-bun-master-certificate.png" alt="平安包達人證書"><p>完成全部三關，這張證書已保存到主程式紀錄。</p><button id="closeCertificate" type="button">收下證書</button></div></div>
