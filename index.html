<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>長洲沿岸釣魚</title><link rel="preload" as="image" href="assets/cheung-chau-start.png" fetchpriority="high"><link rel="preload" as="image" href="assets/cheung-chau-map.png"><link rel="preload" as="image" href="assets/coast-bg.png"><link rel="preload" as="image" href="assets/rod-pro.png"><link rel="stylesheet" href="style.css?v=12"><link rel="stylesheet" href="progression-v1.css"><link rel="stylesheet" href="bait-v1.css"><link rel="stylesheet" href="certificate-v1.css"><link rel="stylesheet" href="mobile-modal-fix-v1.css"></head>
<body><main id="game"><section id="startScreen" class="start-screen"><div class="start-copy"><small>CHEUNG CHAU COASTAL FISHING</small><h1>長洲沿岸釣魚</h1><p>登上小艇，探索長洲四個海灣，認識香港常見鹹水魚。</p><button id="enterGame" class="start-game">開始遊戲</button><div class="preload-status" aria-live="polite"><i id="preloadBar"></i><span id="preloadText">正在準備魚類圖鑑…</span></div><span>30 種香港海魚・4 個長洲釣點</span></div></section><div class="shade"></div><header><div><small id="eyebrow"></small><h1 id="title"></h1></div><div class="top-stats"><span><i id="areaLabel"></i><b id="areaName"></b></span><span><i id="distanceLabel"></i><b><em id="distance">—</em> m</b></span><span><i id="scoreLabel"></i><b id="score">0</b></span></div></header>
<aside class="fight-panel"><section class="power-panel"><b id="powerLabel"></b><div class="power-track"><div class="target"></div><div id="powerNeedle"></div></div><small id="hitHint"></small></section><section class="tension-panel"><b id="tensionLabel"></b><div class="tension-track"><div id="tensionFill"></div></div><small id="tensionHint"></small></section></aside><aside id="questPanel" class="quest-panel hidden"><b id="questTitle">本區通關目標</b><div id="questList"></div><small id="questReward"></small></aside>
<section class="scene"><div id="splash"></div><div id="line"></div><img id="rod" class="rod raised" src="assets/rod-pro.png" alt="第一身釣魚竿"><div id="biteAlert"></div></section>
<div class="cast-control"><button id="start" class="reel" disabled></button><button id="hit" class="reel hidden"></button></div>
<footer><p id="message"></p><div><button id="premiumBait">高級魚餌 × <b id="baitCount">2</b></button><button id="openCertificate" class="hidden">釣魚達人證書</button><button id="openBag"></button><button id="changeArea"></button><button id="returnStory"></button></div></footer><div id="areaModal" class="modal area-modal hidden"><section class="area-card"><button class="close" data-close="areaModal">×</button><small class="modal-kicker">SELECT CHEUNG CHAU FISHING GROUND</small><h2 id="areaTitle"></h2><p id="areaIntro"></p><div id="areaGrid" class="area-grid"></div></section></div>
<div id="catchModal" class="modal hidden"><section class="catch-card"><small id="catchEyebrow"></small><h2 id="catchTitle"></h2><img id="fishArt" alt="魚獲"><h3 id="caughtName"></h3><p id="caughtInfo" class="caught-info"></p><p><b id="caughtWeight"></b> kg · <b id="caughtPoints"></b></p><button id="fishAgain" class="primary"></button><button data-close="catchModal"></button></section></div><div id="areaCompleteModal" class="modal hidden"><section class="catch-card unlock-card"><small>AREA COMPLETE</small><h2 id="areaCompleteTitle"></h2><strong id="areaReward"></strong><p id="areaCompleteText"></p><button id="goUnlockedArea" class="primary"></button><button id="continueFishing">留在目前區域</button></section></div>
<div id="baitModal" class="modal hidden"><section class="bag-card bait-card"><button class="close" data-close="baitModal">×</button><small class="modal-kicker">PREMIUM BAIT</small><h2>選擇目標魚種</h2><p>下一次魚訊有約 90% 機會釣到所選魚種，魚餌會在魚上釣時消耗。</p><div id="baitFishGrid" class="bait-fish-grid"></div><button id="cancelBait" class="hidden">取消已選魚餌</button></section></div>
<div id="certificateModal" class="modal hidden"><section class="certificate-card"><button class="close" data-close="certificateModal">×</button><small>MASTER ANGLER AWARD</small><h2>已獲得釣魚達人證書！</h2><img src="assets/fishing-master-certificate.png" alt="釣魚達人證書"><p>完成長洲全部釣魚區域，這張證書已保存到主程式紀錄。</p><button data-close="certificateModal" class="primary">收下證書</button></section></div>
<div id="bagModal" class="modal hidden"><section class="bag-card"><button class="close" data-close="bagModal">×</button><h2 id="bagTitle"></h2><div id="bagGrid"></div><p id="bagEmpty"></p></section></div></main><link rel="stylesheet" href="game-menu.css?v=1"><link rel="stylesheet" href="fullscreen-safe.css?v=1"><script src="game.js?v=17"></script><script src="fit-stage.js?v=4"></script><script src="game-menu.js?v=1"></script></body></html>
