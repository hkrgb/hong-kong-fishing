<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>香港海岸釣魚</title><link rel="stylesheet" href="style.css"></head><body>
<main id="game"><div class="shade"></div><header><div><small id="eyebrow"></small><h1 id="title"></h1></div><div class="top-stats"><span><i id="areaLabel"></i><b id="areaName"></b></span><span><i id="distanceLabel"></i><b><em id="distance">—</em> m</b></span><span><i id="scoreLabel"></i><b id="score">0</b></span></div></header>
<aside class="power-panel"><b id="powerLabel"></b><div class="power-track"><div class="target"></div><div id="powerNeedle"></div></div><small id="hitHint"></small></aside>
<section class="scene"><div id="splash"></div><div id="line"></div><div id="rod" class="rod raised"><span></span></div><div id="biteAlert"></div></section>
<footer><p id="message"></p><div><button id="start" class="primary"></button><button id="hit" class="primary hidden"></button><button id="openBag"></button><button id="changeArea"></button><button id="returnStory"></button></div></footer></main>
<div id="areaModal" class="modal hidden"><section><button class="close" data-close="areaModal">×</button><h2 id="areaTitle"></h2><div id="areaGrid" class="area-grid"></div></section></div>
<div id="catchModal" class="modal hidden"><section class="catch-card"><small id="catchEyebrow"></small><h2 id="catchTitle"></h2><div id="fishArt">🐟</div><h3 id="caughtName"></h3><p><b id="caughtWeight"></b> kg · <b id="caughtPoints"></b> 分</p><button id="fishAgain" class="primary"></button><button data-close="catchModal"></button></section></div>
<div id="bagModal" class="modal hidden"><section class="bag-card"><button class="close" data-close="bagModal">×</button><h2 id="bagTitle"></h2><div id="bagGrid"></div><p id="bagEmpty"></p></section></div><script src="game.js"></script></body></html>
