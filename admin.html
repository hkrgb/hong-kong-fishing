<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>釣魚遊戲管理後台</title><link rel="stylesheet" href="admin.css?v=3"></head><body><main><small>HONG KONG FISHING CMS</small><h1>釣魚遊戲管理後台</h1>
<section id="login"><h2>管理員登入</h2><p>只有 info@rgb-workshop.com 可以登入及發佈。</p><button id="loginButton">使用 Google 登入</button><p id="loginMessage"></p></section>
<form id="editor" hidden><div class="toolbar"><b id="userEmail"></b><button type="button" id="reload">重新載入</button><button type="button" id="logout">登出</button><button type="submit" class="publish">發佈設定</button></div>
<section><h2>基本與玩法設定</h2><div id="basicFields" class="fields"></div></section>
<section><div class="section-head"><div><h2>魚類資料目錄</h2><p>魚的圖片、重量、分數和難度只需在這裡設定一次。</p></div><button type="button" id="addFish">新增魚類</button></div><div id="catalog"></div></section>
<section><div class="section-head"><div><h2>釣魚地區</h2><p>每區可換背景，輸入魚名便可從資料目錄加入。</p></div><button type="button" id="addArea">新增地區</button></div><div id="areas"></div></section><p id="status"></p></form></main><script type="module" src="admin.js?v=3"></script></body></html>
