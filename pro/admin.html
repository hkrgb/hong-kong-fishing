<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港專業釣魚・管理後台</title><link rel="stylesheet" href="admin.css?v=1"></head><body><main>
<header><div><small>HONG KONG SPORT FISHING CMS</small><h1>專業版管理後台</h1></div><a href="./">開啟遊戲</a></header>
<section id="login" class="login"><h2>管理員登入</h2><p>只限 info@rgb-workshop.com。</p><button id="loginButton">使用 Google 登入</button><p id="loginMessage"></p></section>
<form id="editor" hidden><div class="toolbar"><span id="userEmail"></span><button type="button" id="reload">重新載入</button><button type="button" id="logout">登出</button><button class="publish">發佈全部設定</button></div><p id="status"></p>
<section><h2>基本設定</h2><div id="basic" class="fields"></div></section>
<section><div class="section-head"><div><h2>魚類資料庫</h2><p>設定魚名、圖片、重量、分數與搏魚難度。</p></div><button type="button" id="addFish">＋ 新增魚類</button></div><div id="fish"></div></section>
<section><div class="section-head"><div><h2>釣魚地圖與釣區</h2><p>每區可改背景、地圖位置、難度及可出現魚種。</p></div><button type="button" id="addArea">＋ 新增釣區</button></div><div id="areas"></div></section>
<section><h2>天氣與潮汐</h2><p>咬餌倍率越大越快；張力倍率越大越難。</p><div id="conditions"></div></section>
<section><div class="section-head"><div><h2>釣魚比賽</h2><p>設定時間、目標重量、獎勵分數及獎章。</p></div><button type="button" id="addTournament">＋ 新增比賽</button></div><div id="tournaments"></div></section>
<section><div class="section-head"><div><h2>獎章</h2><p>可修改名稱及圖示；規則欄保留系統英文代碼。</p></div><button type="button" id="addMedal">＋ 新增獎章</button></div><div id="medals"></div></section>
</form></main><script type="module" src="admin.js?v=1"></script></body></html>
