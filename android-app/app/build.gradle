plugins { id 'com.android.application' }

android {
    namespace 'com.rgbworkshop.islandfishing'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rgbworkshop.islandfishing'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ISLAND_KEYSTORE')) {
                storeFile file(System.getenv('ISLAND_KEYSTORE'))
                storePassword System.getenv('ISLAND_STORE_PASSWORD')
                keyAlias 'island-upload'
                keyPassword System.getenv('ISLAND_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
}

android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/gameAssets'))
tasks.register('bundleGame', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'tools/package-android.cjs'
}
tasks.named('preBuild').configure { dependsOn 'bundleGame' }

